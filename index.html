<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Наталья Серикова</title>
<meta name="description" content="Наталья Серикова — медицинский эксперт, врач анестезиолог-реаниматолог. Hey Natash — персональный сайт, проекты и эксперименты.">
<link rel="canonical" href="https://heynatash.ru/">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "name": "Наталья Серикова",
  "jobTitle": "Медицинский эксперт",
  "description": "Врач анестезиолог-реаниматолог",
  "url": "https://heynatash.ru/"
}
</script>
<style>
html,body{margin:0;min-height:100%;background:radial-gradient(at 30% 20%,#173447,#080b16 70%);color:#eafaff;font-family:system-ui}
main{text-align:center;position:relative;margin:32vh auto 0;padding:24px}
h1{font-weight:400;font-size:clamp(44px,10vw,88px);margin:0 0 12px}
p{color:#a8bdca}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
</style>
</head>
<body>
<main><h1>Наталья Серикова, медицинский эксперт</h1><p>Мои проекты и эксперименты.</p><p>Коснись экрана ✧</p></main>
<footer style="position:fixed;bottom:12px;left:12px;right:12px;text-align:center;font-size:12px;color:#a8bdca;opacity:.8;z-index:1">Наталья Серикова, врач анестезиолог-реаниматолог, медицинский эксперт</footer>
<canvas id="bubbles"></canvas>
<script>
(()=>{
const c=document.querySelector('#bubbles'),g=c.getContext('2d'),arr=[],active=new Map();
let w,h,scale,raf=0;
function size(){w=innerWidth;h=innerHeight;scale=Math.min(devicePixelRatio||1,2);c.width=w*scale;c.height=h*scale;g.setTransform(scale,0,0,scale,0,0)}
size();addEventListener('resize',size);
function add(x,y){for(let i=0;i<3;i++){if(arr.length>80)arr.shift();arr.push({x:x+(Math.random()-.5)*37,y:y+(Math.random()-.5)*37,r:(i?6+Math.random()*13:22+Math.random()*22),born:performance.now(),dur:2000+Math.random()*900,dx:(Math.random()-.5)*18});}if(!raf)raf=requestAnimationFrame(draw)}
function draw(now){raf=0;g.clearRect(0,0,w,h);for(let i=arr.length-1;i>=0;i--){let b=arr[i],t=(now-b.born)/b.dur;if(t>=1){arr.splice(i,1);continue}let x=b.x+b.dx*t,y=b.y-t*16,r=b.r*(.85+t*.2),a=Math.min(1,t*12)*Math.pow(1-t,1.4);g.save();g.globalAlpha=a;let v=g.createRadialGradient(x-r*.3,y-r*.4,1,x,y,r);v.addColorStop(0,'rgba(224,252,255,.24)');v.addColorStop(.55,'rgba(46,138,203,.04)');v.addColorStop(1,'rgba(126,210,255,.22)');g.fillStyle=v;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();g.lineWidth=1.5;g.strokeStyle='#93dfff';g.shadowColor='#4acfff';g.shadowBlur=11;g.stroke();g.shadowBlur=0;g.beginPath();g.arc(x,y,r*.82,2.6,4.1);g.lineWidth=Math.max(2,r*.09);g.strokeStyle='rgba(225,252,255,.65)';g.stroke();g.restore()}if(arr.length)raf=requestAnimationFrame(draw)}
addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;active.set(e.pointerId,{x:e.clientX,y:e.clientY,t:performance.now()});add(e.clientX,e.clientY)},{passive:true});
addEventListener('pointermove',e=>{let p=active.get(e.pointerId);if(!p)return;let n=performance.now();if(n-p.t<50||Math.hypot(e.clientX-p.x,e.clientY-p.y)<26)return;add(e.clientX,e.clientY);active.set(e.pointerId,{x:e.clientX,y:e.clientY,t:n})},{passive:true});
['pointerup','pointercancel'].forEach(t=>addEventListener(t,e=>active.delete(e.pointerId),{passive:true}));
})();
</script>
</body>
</html>
